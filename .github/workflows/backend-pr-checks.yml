name: Backend PR Checks

on:
  pull_request:
    branches:
      - master
      - develop
permissions:
  contents: read

concurrency:
  group: backend-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore HockeyPlanner.Backend.sln

      - name: Build
        run: dotnet build HockeyPlanner.Backend.sln --no-restore

      - name: Test
        run: dotnet test HockeyPlanner.Backend.sln --no-build

      - name: Check whitespace errors
        run: git diff --check origin/${{ github.base_ref }}...HEAD
