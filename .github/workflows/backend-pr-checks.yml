name: Backend PR Checks

on:
  pull_request:
    branches:
      - master
      - develop
permissions:
  contents: read

concurrency:
  group: backend-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    uses: ./.github/workflows/validate.yml
    secrets:
      SIXLABORS_LICENSE_KEY: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.SIXLABORS_LICENSE_KEY || '' }}
