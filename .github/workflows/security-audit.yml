name: Security audit
on:
  pull_request:
    branches: [develop]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    name: Deterministic dependency audit
    if: github.repository == 'tracktorist237/HockeyPlanner.Backend' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'develop' }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Test normalizer and workflow safety
        run: |
          pip install -r scripts/quality/requirements.txt
          python -m unittest discover -s scripts/quality -p "test_security_*.py"
      - name: Scan and publish sanitized Job Summary
        run: python scripts/quality/security_audit.py --kind backend
      - name: Sanitized metadata only
        if: always() && hashFiles('security-audit/findings.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deterministic-security-metadata
          path: security-audit/
          retention-days: 7
  codeql:
    name: CodeQL
    if: github.repository == 'tracktorist237/HockeyPlanner.Backend' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # Native SARIF upload only; no repository/settings writes.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'develop' }}
          persist-credentials: false
      - uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          languages: csharp
          build-mode: none
      - uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          category: hp77-csharp
