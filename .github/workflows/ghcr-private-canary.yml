name: One-time private GHCR canary
on:
  pull_request:
    types: [labeled]
    branches: [quality/ghcr-artifact-validation]
permissions:
  contents: read
concurrency:
  group: hp91-private-ghcr-canary
  cancel-in-progress: false
jobs:
  publish:
    name: Private GHCR canary
    if: github.repository == 'tracktorist237/HockeyPlanner.Backend' && github.event.label.name == 'ghcr-canary-approved' && github.head_ref == 'quality/ghcr-private-canary' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify approval state and reuse licensed build and scan
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: python scripts/quality/private_ghcr_canary.py prepare
      - name: Revalidate and publish scanned IID once then verify private digest
        env:
          GHCR_JOB_TOKEN: ${{ github.token }}
        run: python scripts/quality/private_ghcr_canary.py publish
