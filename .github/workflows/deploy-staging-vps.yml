name: Deploy Backend Staging to VPS

on:
  push:
    branches: [ "develop" ]

permissions:
  contents: read

# Serialize deploys; cancelling an SSH runner cannot stop its remote script safely.
concurrency:
  group: backend-staging
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/validate.yml
  deploy:
    needs: validation
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend staging on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/hockeyplanner-staging/backend-src
            EXPECTED_SHA="${{ github.sha }}"
            test -z "$(git status --porcelain)"
            git fetch origin develop
            git merge --ff-only "$EXPECTED_SHA"
            test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
            APP_VERSION="$(cat /opt/hockeyplanner-staging/frontend-src/VERSION | tr -d '[:space:]')"
            APP_COMMIT="$(git rev-parse --short HEAD)"
            APP_BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

            cd /opt/hockeyplanner-staging
            APP_VERSION="$APP_VERSION" APP_COMMIT="$APP_COMMIT" APP_BUILD_TIME="$APP_BUILD_TIME" docker compose build backend

            docker ps -a --format '{{.Names}}' | grep 'hockeyplanner-staging-backend' | xargs -r docker rm -f

            APP_VERSION="$APP_VERSION" APP_COMMIT="$APP_COMMIT" APP_BUILD_TIME="$APP_BUILD_TIME" docker compose up -d backend
            docker compose ps
