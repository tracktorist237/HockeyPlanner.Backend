name: Deploy Backend Staging to VPS

on:
  push:
    branches: [ "develop" ]

permissions:
  contents: read

# Serialize deploys; cancelling an SSH runner cannot stop its remote script safely.
concurrency:
  group: backend-staging
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/validate.yml
    secrets:
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
  deploy:
    needs: validation
    runs-on: ubuntu-latest
    environment: staging-smoke
    timeout-minutes: 60

    steps:
      # Must be set by the owner only AFTER a separate, exact-source operator
      # approval. This implementation does not set the variable or provision VPS.
      - name: Require separate owner approval before private delivery
        env:
          HP92_APPROVED_HEAD: ${{ vars.HP92_APPROVED_HEAD }}
        run: |
          set -eu
          test -n "$HP92_APPROVED_HEAD"
          test "$HP92_APPROVED_HEAD" = "$GITHUB_SHA"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Licensed build and mandatory exact-archive scan
        id: image
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: python scripts/quality/prepare_ci_image.py
      - name: Pinned private transfer and verified staging replacement
        env:
          HP92_APPROVED_HEAD: ${{ vars.HP92_APPROVED_HEAD }}
          HP92_VERIFIED_DIRECTORY: ${{ steps.image.outputs.directory }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: python scripts/quality/deliver_ci_image.py
  smoke:
    name: Backend post-deploy staging verification
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'tracktorist237/HockeyPlanner.Backend'
    environment: staging-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tracktorist237/hockey-planner
          ref: develop
          path: .quality-frontend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: .quality-frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: TEST INFRA - install read-only browser smoke
        working-directory: .quality-frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify deployed backend and staging environment
        env:
          EXPECTED_SHA: ${{ github.sha }}
          STAGING_DIAGNOSTIC_HOST: ${{ secrets.STAGING_DIAGNOSTIC_HOST }}
          STAGING_DIAGNOSTIC_KEY: ${{ secrets.STAGING_DIAGNOSTIC_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: python scripts/staging/smoke.py --kind backend --expected "$EXPECTED_SHA" --backend-repo . --frontend-repo .quality-frontend --output staging-smoke
      - name: Sanitized HTTP and wrapper diagnostics
        if: always() && hashFiles('staging-smoke/summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: backend-staging-summary
          path: staging-smoke/summary.json
          retention-days: 7
      - name: Sanitized browser failure diagnostics
        if: always() && hashFiles('staging-smoke/browser/sanitized.ok') != ''
        uses: actions/upload-artifact@v4
        with:
          name: backend-staging-browser
          path: staging-smoke/browser/
          retention-days: 7
