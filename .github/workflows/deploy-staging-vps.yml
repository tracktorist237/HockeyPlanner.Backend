name: Deploy Backend Staging to VPS

on:
  push:
    branches: [ "develop" ]

permissions:
  contents: read

# Serialize deploys; cancelling an SSH runner cannot stop its remote script safely.
concurrency:
  group: backend-staging
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/validate.yml
    secrets:
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
  deploy:
    needs: validation
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend staging on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            umask 077
            LOCK=/var/lib/hockeyplanner-staging/deploy/deploy.lock
            test -f "$LOCK" && test ! -L "$LOCK"
            test ! -L "$(dirname "$LOCK")"
            test "$(stat -c %a "$(dirname "$LOCK")")" = 700
            test "$(stat -c %u "$(dirname "$LOCK")")" = "$(id -u)"
            test "$(stat -c %a "$LOCK")" = 600
            test "$(stat -c %u "$LOCK")" = "$(id -u)"
            exec 9<>"$LOCK"
            flock -n 9
            test ! -e "$(dirname "$LOCK")/recovery-required"
            test ! -L "$(dirname "$LOCK")/recovery-required"
            # Durable admission barrier also covers SSH loss during source preparation.
            RECOVERY="$(dirname "$LOCK")/recovery-required"
            mkdir "$RECOVERY"
            python3 -c 'import os,sys; fd=os.open(sys.argv[1],os.O_RDONLY|os.O_DIRECTORY); os.fsync(fd); os.close(fd)' "$(dirname "$LOCK")"
            cd /opt/hockeyplanner-staging/backend-src
            EXPECTED_SHA="${{ github.sha }}"
            test -z "$(git status --porcelain)"
            git -c core.hooksPath=/dev/null -c maintenance.auto=false -c gc.auto=0 fetch origin develop
            git -c core.hooksPath=/dev/null -c maintenance.auto=false -c gc.auto=0 merge --ff-only "$EXPECTED_SHA"
            test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
            rmdir "$RECOVERY" # Only our empty barrier, after synchronous source completion.
            APP_VERSION="$(cat /opt/hockeyplanner-staging/frontend-src/VERSION | tr -d '[:space:]')"
            APP_COMMIT="$EXPECTED_SHA"
            APP_BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

            cd /opt/hockeyplanner-staging
            export APP_VERSION APP_COMMIT APP_BUILD_TIME
            python3 backend-src/scripts/staging/deploy_imagesharp.py --expected-sha "$EXPECTED_SHA" --lock-fd 9
  smoke:
    name: Backend post-deploy staging verification
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'tracktorist237/HockeyPlanner.Backend'
    environment: staging-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tracktorist237/hockey-planner
          ref: develop
          path: .quality-frontend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: .quality-frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: TEST INFRA - install read-only browser smoke
        working-directory: .quality-frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify deployed backend and staging environment
        env:
          EXPECTED_SHA: ${{ github.sha }}
          STAGING_DIAGNOSTIC_HOST: ${{ secrets.STAGING_DIAGNOSTIC_HOST }}
          STAGING_DIAGNOSTIC_KEY: ${{ secrets.STAGING_DIAGNOSTIC_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: python scripts/staging/smoke.py --kind backend --expected "$EXPECTED_SHA" --backend-repo . --frontend-repo .quality-frontend --output staging-smoke
      - name: Sanitized HTTP and wrapper diagnostics
        if: always() && hashFiles('staging-smoke/summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: backend-staging-summary
          path: staging-smoke/summary.json
          retention-days: 7
      - name: Sanitized browser failure diagnostics
        if: always() && hashFiles('staging-smoke/browser/sanitized.ok') != ''
        uses: actions/upload-artifact@v4
        with:
          name: backend-staging-browser
          path: staging-smoke/browser/
          retention-days: 7
